version: '3.8'

# =============================================================================
# IT Support AI Agent — full production-style stack
#
#   postgres  : pgvector-enabled database (source of truth)
#   backend   : FastAPI + grounded agent (migrations + seed on boot)
#   nginx     : reverse proxy — serves the built SPA, proxies /api (incl. SSE)
#
# Usage:
#   cp .env.example .env         # then edit secrets
#   docker compose up --build -d
#
# Development profile (Vite dev server with hot reload on :5173):
#   docker compose --profile dev up frontend-dev
# =============================================================================

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: itsupport_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-itsupport_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Loopback-only exposure so host-side tooling and the Vite dev server's
      # /api proxy (host uvicorn on :8000) can reach the database.
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-itsupport_db}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: itsupport_backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      # Database
      POSTGRES_SERVER: db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-itsupport_db}
      POSTGRES_PORT: 5432
      # LLM (Gemini) — optional; deterministic fallback works without a key
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      # Embeddings — local SentenceTransformers (384-dim)
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      LOCAL_EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-384}
      # Security
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
    volumes:
      - backend_models:/root/.cache # persist SentenceTransformers model downloads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/api/v1/live']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: itsupport_nginx
    ports:
      # Host port configurable to avoid collisions (e.g. local dev servers on :3000);
      # default 3001. Override with NGINX_PORT in .env.
      - '${NGINX_PORT:-3001}:80'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # --- Development-only Vite dev server (hot reload) ---
  frontend-dev:
    profiles: ['dev']
    image: node:20-alpine
    container_name: itsupport_frontend_dev
    working_dir: /app
    command: sh -c 'npm install && npm run dev -- --host'
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - '5173:5173'
    depends_on:
      - backend

volumes:
  pgdata:
  backend_models:
